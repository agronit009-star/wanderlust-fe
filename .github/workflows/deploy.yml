name: Wanderlust FE — ECR Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wanderlust-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Copy Compose file to Frontend EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          source: "compose.yaml"
          target: "~/wanderlust/frontend/"

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ap-south-1
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          timeout: 30s
          command_timeout: 10m
          envs: ECR_REGISTRY,AWS_REGION
          script: |
            cd ~/wanderlust/frontend

            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose pull
            docker compose down || true
            docker compose up -d

      - name: Verify HTTPS
        run: |
          curl -sf -o /dev/null \
            -w '%{http_code}\n' \
            https://wanderlust01.duckdns.org/
