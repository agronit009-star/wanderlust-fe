name: Wanderlust FE — ECR Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wanderlust-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Validate SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PEM }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          ssh-keygen -lf /tmp/deploy_key.pub
      
      - name: Copy Compose file to Frontend EC2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PEM }}
          FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/wanderlust_key
          chmod 600 ~/.ssh/wanderlust_key

          ssh-keyscan -H "$FE_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/wanderlust_key \
            -o StrictHostKeyChecking=yes \
            compose.yaml \
            ubuntu@"$FE_PUBLIC_IP":~/wanderlust/frontend/compose.yaml

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ap-south-1
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          timeout: 30s
          command_timeout: 10m
          envs: ECR_REGISTRY,AWS_REGION
          script: |
            cd ~/wanderlust/frontend

            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            docker compose pull
            docker compose down || true
            docker compose up -d

      - name: Verify HTTPS
        run: |
          curl -sf -o /dev/null \
            -w '%{http_code}\n' \
            https://wanderlust01.duckdns.org/
