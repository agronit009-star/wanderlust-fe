name: Wanderlust FE — ECR Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wanderlust-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Copy Compose file to Frontend EC2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PEM }}
          FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/wanderlust_key
          chmod 600 ~/.ssh/wanderlust_key

          ssh-keyscan -H "$FE_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/wanderlust_key \
            -o StrictHostKeyChecking=yes \
            compose.yaml \
            ubuntu@"$FE_PUBLIC_IP":~/wanderlust/frontend/compose.yaml

      - name: Deploy Frontend to EC2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PEM }}
          FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ap-south-1
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/wanderlust_key
          chmod 600 ~/.ssh/wanderlust_key

          ssh-keyscan -H "$FE_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/wanderlust_key \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$FE_PUBLIC_IP" << EOF

            set -e

            cd ~/wanderlust/frontend

            echo "Logging into ECR..."

            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Pulling latest frontend image..."

            export ECR_REGISTRY=$ECR_REGISTRY

            docker compose pull

            echo "Stopping old container..."

            docker compose down

            echo "Starting new container..."

            docker compose up -d

            echo "Deployment completed."

            docker ps

          EOF

      - name: Verify HTTPS
        run: |
          curl -sf -o /dev/null \
            -w 'HTTP Status: %{http_code}\n' \
            https://wanderlust01.duckdns.org/
